[pytest]
# Configure pytest to collect test files named test_*.py
testpaths = kdiff/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configure test verbosity and output format
addopts = -v --cov=kdiff --cov-report=term --cov-report=html

# Configure test markers
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests that take longer to run
    fast: marks tests that run quickly
